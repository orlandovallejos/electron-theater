name: Feature request
description: Propose a new feature or improvement
title: 'feat: '
labels: ['type: feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who has it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Mention alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: learn
    attributes:
      label: What we'll learn
      description: Optional. One or two questions this issue should answer, about the why, not the what. The PR answers them in its Lesson.
      placeholder: |
        - Why do we need ...?
        - What's the difference between ... and ...?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist that says when this is done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
