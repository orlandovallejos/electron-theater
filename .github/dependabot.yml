version: 2
updates:
  # Every npm workspace (the root, apps/*, packages/*). Minor and patch updates arrive together in one
  # weekly PR, so they stay easy to review. Major updates get their own PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore'
    groups:
      # react and react-dom must always be on the same version, so they update in one PR.
      # Listed before minor-and-patch, because a dependency goes into the first group that matches.
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # React 19 is a migration, not a version bump: #99. Remove this when it is done.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      # ESLint stays on 9 until eslint-plugin-react supports 10: #100. Remove this when it is done.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # React Router 7 is a migration (the tests fail on it): #114. Remove this when it is done.
      - dependency-name: react-router-dom
        update-types: ['version-update:semver-major']
      # TypeScript 7 needs ts-loader, ts-jest and typescript-eslint to support it first: #115.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # Dependencies of the packaged app (release/app).
  - package-ecosystem: npm
    directory: /apps/desktop/release/app
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'ci'
